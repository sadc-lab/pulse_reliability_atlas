[project]
name = "pulse_reliability_atlas"
version = "0.1.0"
description = "Open reliability atlas for the Pulse Physiology Engine (v4.3.1)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "Santino Nanini"},
]
dependencies = [
    "salib>=1.5.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "streamlit>=1.38.0",
    "tqdm>=4.66.0",
    "pydantic>=2.8.0",
    # Required by scripts/pdf_probe.py, scripts/check_render.py (pre-commit hook)
    # and scripts/make_fig00_study_design.py. It was installed in the local
    # .venv but declared nowhere until 2026-08-14, so a clean clone could not
    # run the render check or regenerate the paper Figure 1.
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    # Pin ruff to a narrow band so CI matches local. New ruff minor versions
    # enable rules by default that older versions ignored, which broke S009/S010
    # CI runs while local was clean. Bump deliberately; do not let it drift.
    "ruff>=0.15.0,<0.16.0",
]
ml = [
    # Supplementary ML cross-check: train an RF surrogate on the clean-subset
    # sweep outputs and compare SHAP rankings against Morris mu*. Not part of
    # the core atlas pipeline; pinned loosely.
    "scikit-learn>=1.5.0",
    "shap>=0.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
