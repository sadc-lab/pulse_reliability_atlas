name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel duplicate workflows on the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Install project + dev deps
        run: uv sync --extra dev

      - name: Run pytest (no Pulse / Docker — fast suite)
        run: uv run pytest tests/ -v --tb=short

      - name: Verify analysis modules import on a clean Python
        run: |
          uv run python -c "from src import sampler, scenario, runner, aggregator, detector, analysis_morris, analysis_compare; print('imports OK')"

  ruff:
    name: ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
      - run: uv sync --extra dev
      - run: uv run ruff check src/ scripts/ tests/ engine/

  claims-audit:
    name: claims-ledger audit (monograph + paper-sync)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Install project + dev deps
        run: uv sync --extra dev

      # Both invocations exit non-zero on ANY FAIL, so a quantitative-claim
      # drift in preprint/manuscript.md or preprint_npj/paper.tex blocks the
      # merge. The legacy run audits the monograph ledger; --check-paper-sync
      # additionally verifies paper.tex + supplement.tex against the crosswalk.
      # Note: the single T1.06u kinetic anchor self-skips here because it reads
      # git-ignored per-run output.csv trajectories absent on a clean checkout
      # (see scripts/audit_claims.py); all other anchors run as the gate.
      - name: Monograph claims-ledger audit (fail on any FAIL)
        run: uv run python scripts/audit_claims.py

      - name: Paper-monograph crosswalk sync audit (fail on any FAIL)
        run: uv run python scripts/audit_claims.py --check-paper-sync

      # Third layer: monograph-only numerical claims that have no ledger
      # anchor and no crosswalk row (preprint/monograph_anchor_map.md). This
      # is a presence guard -- it detects a verified value silently drifting,
      # it does not verify correctness. It needs no data artifacts, so it runs
      # identically on a clean checkout and on the authors' full tree.
      - name: Monograph anchor-map audit (fail on any FAIL)
        run: uv run python scripts/audit_claims.py --check-monograph

      # The head-line counter guard (audit_claims.py, 2026-08-03) verifies the
      # audit's OWN counters -- ledger anchors, crosswalk entries, monograph
      # anchors -- wherever the corpus quotes them, README.md included. It needs
      # both totals, so it runs only under `--check-paper-sync --check-monograph`
      # TOGETHER. The three steps above pass those flags SEPARATELY, so the guard
      # had never once executed in CI. Found 2026-09-05 by mutation: with
      # README.md edited to 383, the bare audit exits 0 in silence; with both
      # flags it exits 1 on `README.md:297 | ledger total | 383 | expected 382`.
      # The pre-commit hook already runs the combination, so only hook-bypassing
      # paths were exposed (--no-verify, a GitHub web edit, a clone without
      # core.hooksPath). Kept as a fourth invocation rather than folded into the
      # step above, so a failure still names which layer broke.
      - name: Head-line counter guard (needs both flags together)
        run: uv run python scripts/audit_claims.py --check-paper-sync --check-monograph

      # Fourth layer, added 2026-09-03 after eleven bibliography keys left
      # paper.tex + supplement.tex unnoticed during the synthesis pass: six of
      # them left a claim standing with no source. Every gate above stayed
      # green throughout, because none of them measures the citation set.
      # Invariants and manifest: audit/citation_manifest.txt.
      - name: Citation manifest gate (fail on any violation)
        run: uv run python scripts/check_citations.py

      # Fifth layer, added 2026-09-03. Four live files advertised a stale
      # ledger anchor count and a stale crosswalk row count, months after both
      # had grown past them; one of the four was not even in the register that
      # tracked the other three. audit_claims.py already refuses to hard-code
      # its own total; this extends that rule to live prose.
      - name: No hard-coded ledger counts in live files
        run: uv run python scripts/check_stale_counts.py

      # Sixth layer, added 2026-09-04. Supplement S6 still opened with "The
      # Discussion of the main manuscript reports that the cross-sex Spearman
      # rank correlation ..." after the September condensation pass had deleted
      # that result from the paper. Nothing measured it: check_render's crossdoc
      # check verifies only the NUMBER in \mainref{}{}, audit_claims verifies
      # numeric literals, and a pointer-following sweep cannot see a pointer
      # that was removed. Manifest: audit/backref_manifest.txt.
      - name: Supplement back-references still hold in the paper
        run: uv run python scripts/check_backrefs.py

      # Added 2026-09-07 after the author, re-reading the mailed PDFs, found Methods 4.3 stating
      # Vt 300-700 mL and PEEP 0-15 cmH2O while the sweep ran on 300-800 and
      # 0-20. The wrong literals were introduced by a prose-COMPRESSION edit
      # (d88a1ca) and shipped to the co-authors. Nothing measured the sentence
      # against src/sampler.py: audit_claims parses those bounds but only to
      # normalise the clip computation, and a numeric diff of the two drafts is
      # blind here because "700" and "15" already occurred elsewhere.
      - name: Manuscript input ranges still match src/sampler.py
        run: uv run python scripts/check_input_ranges.py

      # Added 2026-09-07. Section 2.2 now states how much data each published
      # Morris index rests on: 9 of the 144 top-three entries come from a
      # single elementary-effect pair, 25 from three or fewer, median 7 of 20.
      # Five ledger anchors were written first and rejected: one added anchor
      # changes the ledger total, which 25 places across README, supplement and
      # monograph quote, so it cascades. A guard carries its own counter.
      # Widened the same day to the rest of the paragraph, which had drifted
      # from the code in two ways: the trigger written "> 0.6" where the
      # preregistration and both implementations use ">= 0.6", and "in all five
      # bootstrap draws" where there are N_BOOTSTRAP draws per seed and five
      # seeds. The second is the same conflation 83da8a2 had already fixed in
      # Methods 4.6 hours earlier: that sweep found one locus, the population
      # was two.
      - name: Results 2.2 non-linearity paragraph still matches its sources
        run: uv run python scripts/check_pair_counts.py

      # Added 2026-09-08. da5bd97 repaired plateau_stats.parquet on 2026-09-02
      # and regenerated two of the three figures that read it; the third kept
      # printing a minimum of 779 mmHg where the repaired data gives 770, and
      # shipped to the co-authors on 2026-09-05. The existing figure-timestamp
      # guard passed 29/29 throughout, because it checks the PINNED epoch, which
      # is identical whether a figure was built in August or today. This one
      # compares git ancestry instead: the data a figure reads must not have
      # moved after the figure was last built. No regeneration, so it gives the
      # same answer on ubuntu-latest as on the Windows machine that builds them.
      - name: Tracked figures are not older than the data they draw
        run: uv run python scripts/check_figure_freshness.py
